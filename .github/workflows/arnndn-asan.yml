name: arnndn ASan

# Hunts the out-of-bounds access in libavfilter/af_arnndn.c.
#
# Why Linux and not the Windows build we ship: the fault is in C, not in the
# toolchain — the official BtbN build (gcc, no LTO) crashes too, so it is not
# ours. AddressSanitizer reports a bad read the moment it happens, whether or
# not it would have crashed, which means this does not need the material that
# crashes and does not need any of Gordan's recordings.
#
# The build is cut to almost nothing so it finishes in minutes.

on:
  workflow_dispatch:
    inputs:
      ffmpeg_ref:
        description: 'FFmpeg ref to test (branch, tag or sha)'
        required: false
        default: 'master'

jobs:
  asan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm clang git

      - name: Clone FFmpeg
        run: |
          git clone --depth 1 --branch "${{ github.event.inputs.ffmpeg_ref || 'master' }}" \
            https://github.com/FFmpeg/FFmpeg.git ffmpeg || \
          (git clone https://github.com/FFmpeg/FFmpeg.git ffmpeg && \
           cd ffmpeg && git checkout "${{ github.event.inputs.ffmpeg_ref }}")
          cd ffmpeg && git log -1 --format='%H %ad %s'

      - name: Configure with AddressSanitizer
        working-directory: ffmpeg
        run: |
          ./configure \
            --toolchain=clang-asan \
            --disable-everything --disable-doc --disable-programs \
            --enable-ffmpeg \
            --enable-filter=arnndn,aresample,aformat,anoisesrc,sine,volume,atrim,apad \
            --enable-decoder=pcm_s16le,pcm_f32le \
            --enable-encoder=pcm_s16le \
            --enable-demuxer=wav --enable-muxer=wav,null \
            --enable-protocol=file --enable-filter=aevalsrc \
            --disable-optimizations --disable-stripping
          tail -5 ffbuild/config.log || true

      - name: Build
        working-directory: ffmpeg
        run: make -j$(nproc) ffmpeg

      - name: Model
        run: |
          curl -sL -o sh.rnnn \
            https://raw.githubusercontent.com/GregorR/rnnoise-models/master/somnolent-hogwash-2018-09-01/sh.rnnn
          ls -l sh.rnnn

      - name: Make test material
        working-directory: ffmpeg
        run: |
          python3 - <<'PY'
          import math, random, struct, wave, sys
          
          # Six different characters, because one regular signal proved nothing: the first
          # ASan pass was clean on a tidy warbling tone. Real speech is irregular — pitch
          # jumps, plosives, silence, breath — and the pitch search reacts to exactly that.
          SR = 48000
          random.seed(int(sys.argv[1]) if len(sys.argv) > 1 else 1)
          
          def write(name, fn, dur):
              w = wave.open(name, "wb"); w.setnchannels(1); w.setsampwidth(2); w.setframerate(SR)
              out = bytearray()
              for n in range(int(SR * dur)):
                  v = max(-1.0, min(1.0, fn(n / SR)))
                  out += struct.pack("<h", int(v * 32767))
              w.writeframes(bytes(out)); w.close()
          
          def voiced(t, f0):
              return sum((0.5 / h) * math.sin(2 * math.pi * f0 * h * t) for h in (1, 2, 3, 4, 5))
          
          # 1. jumping pitch with hard gaps and occasional plosive bursts
          def a(t):
              seg = int(t / 0.31)
              random.seed(seg + 1000)
              f0 = 90 + random.random() * 180
              env = 0.0 if (t % 0.31) > 0.24 else 1.0
              burst = 0.8 if (t % 0.31) < 0.006 else 0.0
              return (voiced(t, f0) * env * 0.5 + burst * (random.random() * 2 - 1)
                      + 0.02 * (random.random() * 2 - 1))
          
          # 2. very quiet, near the silence threshold arnndn tests against
          def b(t):
              return voiced(t, 130) * 0.02 + 0.004 * (random.random() * 2 - 1)
          
          # 3. loud, clipping-adjacent
          def c(t):
              return voiced(t, 110) * 0.95 + 0.05 * (random.random() * 2 - 1)
          
          # 4. noise only, no pitch at all
          def d(t):
              return 0.3 * (random.random() * 2 - 1)
          
          # 5. rapid alternation between silence and full level, every 20 ms
          def e(t):
              return voiced(t, 160) * (1.0 if int(t / 0.02) % 2 else 0.0) * 0.6
          
          # 6. sweeping pitch across the whole search range
          def f(t):
              return voiced(t, 60 + 700 * (t / 15.0)) * 0.5
          
          for name, fn, dur in (("s1.wav", a, 20), ("s2.wav", b, 12), ("s3.wav", c, 12),
                                ("s4.wav", d, 12), ("s5.wav", e, 12), ("s6.wav", f, 15)):
              write(name, fn, dur)
              print("wrote", name)
          PY
          ls -l s*.wav

      - name: Run under ASan
        working-directory: ffmpeg
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=0:print_stacktrace=1
        run: |
          set +e
          bad=0
          for f in s1 s2 s3 s4 s5 s6; do
            for mix in 0.4 0.8 1.0; do
              echo "=== $f mix=$mix ==="
              ./ffmpeg -hide_banner -nostdin -y -i $f.wav \
                -af "arnndn=m=../sh.rnnn:mix=$mix" -c:a pcm_s16le -f null - 2>&1 \
                | grep -E "AddressSanitizer|SUMMARY|READ of size|WRITE of size|#[0-9]+ 0x" && bad=1
            done
          done
          echo "=== Bell's own path: 22 kHz in, resample, pad, arnndn ==="
          for f in s1 s3 s5; do
            ./ffmpeg -hide_banner -nostdin -y -i $f.wav -c:a pcm_s16le -ar 22050 $f-22.wav 2>/dev/null
            ./ffmpeg -hide_banner -nostdin -y -i $f-22.wav \
              -af "aresample=48000,apad=pad_len=4800,arnndn=m=../sh.rnnn:mix=0.8" \
              -c:a pcm_s16le -ar 22050 -ac 1 -f null - 2>&1 \
              | grep -E "AddressSanitizer|SUMMARY|READ of size|WRITE of size|#[0-9]+ 0x" && bad=1
          done
          echo ""
          if [ $bad -eq 0 ]; then
            echo "CISTO — ASan nije prijavio nijedan pristup izvan granica."
            echo "To NE znaci da buga nema: znaci da ga ovaj materijal ne pogadja."
          else
            echo "NASAO — vidi izvjestaj gore."
          fi
          exit 0
